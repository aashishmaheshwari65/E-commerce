# ==============================================================================
# Apache Airflow Orchestration Stack (Functionality 6 & 18)
# Run command: docker compose -f docker-compose.airflow.yml up -d
# ==============================================================================

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.2
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW_HOME=/opt/airflow
    - AIRFLOW_UID=${AIRFLOW_UID:-50000}
    - _PIP_ADDITIONAL_REQUIREMENTS=pandas pyarrow supabase python-dotenv scikit-learn scipy
  env_file:
    - .env
  volumes:
    # Airflow core directories
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Project data lake and database modules
    - ./data:/opt/airflow/data
    - ./ingestion:/opt/airflow/ingestion
    - ./validation:/opt/airflow/validation
    - ./etl:/opt/airflow/etl
    - ./data_lake:/opt/airflow/data_lake
    - ./data_warehouse:/opt/airflow/data_warehouse
    - ./sql_analytics:/opt/airflow/sql_analytics
    # Machine Learning modules for automated ML pipeline
    - ./customer_segmentation:/opt/airflow/customer_segmentation
    - ./churn_prediction:/opt/airflow/churn_prediction
    - ./sales_forecasting:/opt/airflow/sales_forecasting
    - ./recommendation_system:/opt/airflow/recommendation_system
    - ./ml_pipeline:/opt/airflow/ml_pipeline
    - ./monitoring:/opt/airflow/monitoring
  networks:
    - ecommerce-network
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Isolated metadata database strictly for Apache Airflow (separate from Supabase)
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-time initialization container: runs migrations & creates admin user
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: version
    entrypoint:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname Admin --lastname User || true
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow Webserver UI (bound to 127.0.0.1:8080 for local development security)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler daemon
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-data:
    name: ecommerce-airflow-postgres-data

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge
