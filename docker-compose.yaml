version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.2
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW_HOME=/opt/airflow
    - _PIP_ADDITIONAL_REQUIREMENTS=pandas pyarrow supabase python-dotenv scikit-learn scipy
  env_file:
    - .env
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./validation:/opt/airflow/validation
    - ./etl:/opt/airflow/etl
    - ./data_lake:/opt/airflow/data_lake
    - ./data_warehouse:/opt/airflow/data_warehouse
    - ./sql_analytics:/opt/airflow/sql_analytics
    - ./customer_segmentation:/opt/airflow/customer_segmentation
    - ./churn_prediction:/opt/airflow/churn_prediction
    - ./sales_forecasting:/opt/airflow/sales_forecasting
    - ./recommendation_system:/opt/airflow/recommendation_system
    - ./ml_pipeline:/opt/airflow/ml_pipeline
    - ./monitoring:/opt/airflow/monitoring
    - ./data:/opt/airflow/data
    - ./ingestion:/opt/airflow/ingestion
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    command: version
    entrypoint: 
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname Admin --lastname User
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
