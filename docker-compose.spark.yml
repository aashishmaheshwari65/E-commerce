# ==============================================================================
# Optional Apache Spark Standalone Cluster Stack (PySpark Processing)
# Run command: docker compose -f docker-compose.spark.yml up -d
# ==============================================================================

services:
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: ecommerce-spark-master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      # Master RPC port
      - "7077:7077"
      # Master Web UI (mapped to host 8081 to avoid conflict with Airflow on 8080)
      - "8081:8080"
    volumes:
      - ./data:/opt/bitnami/spark/data
      - ./spark_processing:/opt/bitnami/spark/spark_processing
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: ecommerce-spark-worker
    restart: unless-stopped
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      # Worker Web UI
      - "8082:8081"
    volumes:
      - ./data:/opt/bitnami/spark/data
      - ./spark_processing:/opt/bitnami/spark/spark_processing
    depends_on:
      - spark-master
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge
